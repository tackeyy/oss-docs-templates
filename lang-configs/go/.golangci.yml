version: "2"

run:
  modules-download-mode: readonly
  tests: true

linters:
  # The v2 standard set already enables errcheck, govet, ineffassign, staticcheck,
  # and unused. misspell and revive are enabled explicitly in addition to that set.
  enable:
    - misspell      # Find misspelled words
    - revive        # Drop-in replacement for golint
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
    revive:
      severity: warning
      rules:
        - name: exported
        - name: indent-error-flow
        - name: error-return
        - name: error-strings
        - name: error-naming
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
