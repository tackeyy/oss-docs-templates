name: Lint

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # 3.10 は 2026-10 まで security サポート。3.14 が現行の最新安定版。
        # lint と型検査は最古ではなく最新の版だけで実行する。
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install tooling and dependencies
        run: |
          pip install pytest pytest-cov
          if [ "${{ matrix.python-version }}" = "3.14" ]; then
            pip install ruff mypy
          fi
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Run ruff check
        if: matrix.python-version == '3.14'
        run: ruff check .

      - name: Run ruff format check
        if: matrix.python-version == '3.14'
        run: ruff format --check .

      # 適用直後は .py が無い。mypy は致命エラー exit 2 と
      # 「There are no .py[i] files...」を出す。型エラーは exit 1 なので失敗のままにする。
      # exit 2 は他の致命エラーにも使う。成功にしてよいのは、.py が 1 件も無く、
      # かつその空ツリーのメッセージのときだけ。.py があるのに exclude などで
      # 同じメッセージになった場合は失敗させる。
      # ファイルの有無は find で見る。.git などの VCS メタデータ、ツールのキャッシュ、
      # 仮想環境、node_modules はプロジェクトのソースではないので降りない。
      # 不正な設定値（未知のキー、boolean に文字列、解釈できない python_version など）は
      # mypy がメッセージを出しても exit 0 になることがある。このステップはそれを失敗にできない。
      # 不正な exclude 正規表現のような致命的な設定は exit 2 のまま失敗する。
      - name: Run mypy
        if: matrix.python-version == '3.14'
        run: |
          set +e
          output="$(mypy . 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          py_files="$(
            find . \
              \( -name .git -o -name .hg -o -name .svn \
                 -o -name __pycache__ -o -name .mypy_cache -o -name .ruff_cache \
                 -o -name .pytest_cache -o -name .venv -o -name venv \
                 -o -name node_modules \) -prune \
              -o -type f -name '*.py' -print -quit
          )"
          if [ "$status" -eq 2 ] \
            && [ -z "$py_files" ] \
            && printf '%s\n' "$output" | grep -Fq "There are no .py[i] files in directory '.'"; then
            echo "No Python files found; skipping mypy"
            exit 0
          fi
          exit "$status"

      # pytest の exit 5 は「テストを 1 件も収集できなかった」コード。
      # マーカーなどで全件 deselect されたときも 5 になる。
      # test_*.py / *_test.py が 1 件も無いときだけ 5 を成功にする。
      # テストファイルがあるときの 5 は失敗のままにする。失敗（1）や収集エラー（2、4）もそのまま。
      # ファイルの有無は find で見る。除外するディレクトリは mypy の判定と同じ。
      - name: Run tests
        run: |
          set +e
          pytest --cov --cov-report=xml
          status=$?
          set -e
          if [ "$status" -eq 5 ]; then
            test_files="$(
              find . \
                \( -name .git -o -name .hg -o -name .svn \
                   -o -name __pycache__ -o -name .mypy_cache -o -name .ruff_cache \
                   -o -name .pytest_cache -o -name .venv -o -name venv \
                   -o -name node_modules \) -prune \
                -o -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit
            )"
            if [ -z "$test_files" ]; then
              echo "No tests collected; treating pytest exit code 5 as success"
              exit 0
            fi
          fi
          exit "$status"

      # テストが 0 件のときは coverage.xml が作られない。ファイルがあるときだけ送る。
      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        if: matrix.python-version == '3.14' && hashFiles('coverage.xml') != ''
        with:
          file: ./coverage.xml
