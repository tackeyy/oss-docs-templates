name: Lint

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Swift Quality
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Xcode version
        id: xcode
        run: |
          version="$(xcodebuild -version | awk 'NR==1 { print $2 }')"
          if [ -z "$version" ]; then
            echo "error: could not read the Xcode version from xcodebuild -version" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Swift build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-xcode-${{ steps.xcode.outputs.version }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ steps.xcode.outputs.version }}-spm-

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint
        run: swiftlint

      - name: Build and Test
        run: swift test --enable-code-coverage

      - name: Generate coverage report
        run: |
          bin_path="$(swift build --show-bin-path)"
          if [ -z "$bin_path" ] || [ ! -d "$bin_path" ]; then
            echo "error: swift build --show-bin-path did not return a directory (got: '${bin_path:-}')" >&2
            exit 1
          fi
          # native emits *PackageTests.xctest; swiftbuild (Swift 6.4+) emits one *.xctest per test target.
          matches="$(find "$bin_path" -type d -name '*.xctest' | sort)"
          xctest_count="$(printf '%s\n' "$matches" | grep -c . || true)"
          if [ "$xctest_count" -eq 0 ]; then
            echo "error: no *.xctest bundle under ${bin_path}" >&2
            exit 1
          fi
          primary=""
          object_args=()
          while IFS= read -r xctest; do
            [ -n "$xctest" ] || continue
            bundle_name="$(basename "$xctest" .xctest)"
            test_binary="${xctest}/Contents/MacOS/${bundle_name}"
            if [ ! -f "$test_binary" ]; then
              echo "error: test executable not found: ${test_binary}" >&2
              exit 1
            fi
            if [ -z "$primary" ]; then
              primary="$test_binary"
            else
              object_args+=(-object "$test_binary")
            fi
          done <<< "$matches"
          profdata="${bin_path}/codecov/default.profdata"
          if [ ! -f "$profdata" ]; then
            echo "error: coverage profile not found: ${profdata}" >&2
            exit 1
          fi
          xcrun llvm-cov export -format="lcov" \
            "$primary" \
            "${object_args[@]}" \
            -instr-profile "$profdata" > coverage.lcov

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          file: ./coverage.lcov
