name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 公式リリースの linux-amd64 アーカイブを版とチェックサムで固定する。
      # 更新時は https://github.com/golangci/golangci-lint/releases の
      # golangci-lint-<version>-checksums.txt から linux-amd64.tar.gz の値を取る。
      GOLANGCI_LINT_VERSION: "2.13.2"
      GOLANGCI_LINT_SHA256: "2277d43b98ec0054280f2ac26b53268bae97682444678a59a657dd565da021d6"
      # 公式リリースの linux x86_64 アーカイブを版とチェックサムで固定する。
      # 更新時は https://github.com/astral-sh/ruff/releases の sha256.sum から
      # ruff-x86_64-unknown-linux-gnu.tar.gz の値を取る。タグに v は付かない。
      RUFF_VERSION: "0.16.8"
      RUFF_SHA256: "c4a8c7c152532bcb7e7ede4bd6ccd440dcacddffcdcdd79b90090ac6021f41c2"
      # 公式リリースの linux amd64 アーカイブを版とチェックサムで固定する。
      # 更新時は https://github.com/rhysd/actionlint/releases の
      # actionlint_<version>_checksums.txt から linux_amd64.tar.gz の値を取る。
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        run: shellcheck apply-templates.sh tests/*.sh

      # ubuntu-latest（Ubuntu 24.04）の software report では Go は Language and Runtime に無く、
      # Cached Tools（toolcache）にだけある。toolcache の go は PATH に入らない。
      # go-version 1.26 はその Cached Tools にある minor。
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false

      - name: Install golangci-lint
        run: |
          archive="golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/${archive}"
          echo "${GOLANGCI_LINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" \
            "golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64/golangci-lint"
          echo "$RUNNER_TEMP/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64" >> "$GITHUB_PATH"

      - name: Install ruff
        run: |
          archive="ruff-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/astral-sh/ruff/releases/download/${RUFF_VERSION}/${archive}"
          echo "${RUFF_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" \
            "ruff-x86_64-unknown-linux-gnu/ruff"
          echo "$RUNNER_TEMP/ruff-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Install actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      # mypy と pytest の wheel は CPython 3.12 / linux x86_64 向けに
      # .github/python-tools-requirements.txt で版と sha256 を固定する。
      # actions/setup-python の cache は pip / pipenv / poetry だけ。
      # キャッシュしないときはキーを書かない（false は受け付けない）。
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install mypy and pytest
        run: python -m pip install --no-cache-dir --require-hashes -r .github/python-tools-requirements.txt

      - name: Test suite
        env:
          REQUIRE_TOOLS: "1"
        run: bash tests/run-suite.sh
