name: ❓ Question
description: Ask a question about using {{PROJECT_NAME}}
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Have a question? We're here to help!

        **Do not paste real data or tokens.** Assume that anything you post here can be read by others.
        Do not include real credentials, tokens, or personal data.
        Redact them or replace them with dummy values.

        **Report vulnerabilities privately.** Please do not report security
        vulnerabilities through public GitHub issues, discussions, or pull requests.
        Use GitHub [Private vulnerability reporting](https://github.com/{{REPO_OWNER}}/{{REPO_NAME}}/security/advisories/new),
        as described in [SECURITY.md](https://github.com/{{REPO_OWNER}}/{{REPO_NAME}}/security/policy).

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What would you like to know about {{PROJECT_NAME}}?
      placeholder: |
        How do I configure this project?
        What usage pattern do you recommend for...?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Any additional context or what you've already tried
      placeholder: |
        I've tried... but I'm getting...
        I looked at the documentation but...
    validations:
      required: false
