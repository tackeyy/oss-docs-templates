name: 💡 Feature Request
description: Suggest a new feature or enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please provide details below.

        **Do not paste real data or tokens.** This repository is public.
        Do not include real credentials, tokens, or personal data.
        Redact them or replace them with dummy values.

        **Report vulnerabilities privately.** Please do not report security
        vulnerabilities through public GitHub issues, discussions, or pull requests.
        Use GitHub [Private vulnerability reporting](https://github.com/{{REPO_OWNER}}/{{REPO_NAME}}/security/advisories/new),
        as described in [SECURITY.md](https://github.com/{{REPO_OWNER}}/{{REPO_NAME}}/security/policy).

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this feature solve?
      placeholder: |
        Currently, there's no way to...
        This makes it difficult to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this feature to work?
      placeholder: |
        Add a new option or workflow that allows users to...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other solutions or workarounds have you considered?
      placeholder: |
        I tried using... but it doesn't work because...
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other context, mockups, or examples
    validations:
      required: false
